<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FSR4 — Riwayat Pengukuran</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script>
<style>
:root{color-scheme:dark;font-family:Segoe UI,Arial;background:#071321;color:#eaf2ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#071321,#122b45);min-height:100vh}main{max-width:1100px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}h1{margin:0;font-size:27px}.muted{color:#9eb4cc;font-size:13px}.panel,.session{background:#112840;border:1px solid #294967;border-radius:18px;padding:18px;margin-bottom:14px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button{border:0;border-radius:10px;padding:11px 15px;background:#2563eb;color:white;font-weight:700;cursor:pointer}button.secondary{background:#36516f}a{color:#9bcaff}.session{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.session h3{margin:0 0 7px}.actions{display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-block;padding:6px 10px;border-radius:99px;background:#25415d;font-size:12px}.good{background:#14543f}.warn{background:#765016}.bad{background:#762b36}.qrwrap{display:none;margin-top:14px;padding:14px;border-radius:14px;background:#f8fafc;color:#102033;width:max-content;max-width:100%}.qrwrap canvas,.qrwrap img{max-width:100%}.empty{padding:25px;text-align:center;color:#9eb4cc}.foot{font-size:12px;color:#9eb4cc;line-height:1.6}@media(max-width:600px){main{padding:14px}.session{align-items:flex-start}.actions{width:100%}}
</style></head><body><main>
<header><div><h1>FSR4 · Riwayat Pengukuran</h1><div class="muted">Setiap pengukuran disimpan sebagai sesi yang terpisah.</div></div><span class="badge" id="sync">Memeriksa penyimpanan…</span></header>
<section class="panel"><div class="toolbar"><a href="Laptop_Monitor.html">← Kembali ke monitoring</a><button class="secondary" id="refresh">Muat ulang</button><button id="syncBtn">Sinkronkan Firebase</button></div><p class="foot">Sesi disimpan lokal di browser laptop. Sesi yang sudah disinkronkan dapat dibuka dari HP melalui QR selama Firebase dan halaman laporan online tersedia.</p></section>
<div id="list"></div>
</main>
<script>
const DB_NAME='FSR4_LocalDB',STORE='sessions';const $=id=>document.getElementById(id);
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function all(){let db=await openDB();return new Promise((res,rej)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res((r.result||[]).sort((a,b)=>b.startedAt.localeCompare(a.startedAt)));r.onerror=()=>rej(r.error)})}
async function firebaseDB(){let raw=localStorage.getItem('fsr4FirebaseConfig');let cfg=raw?JSON.parse(raw):window.FSR4_FIREBASE_CONFIG;if(!cfg)throw new Error('Konfigurasi Firebase tidak ditemukan.');if(typeof firebase==='undefined')throw new Error('Firebase SDK gagal dimuat. Periksa koneksi internet/CDN.');if(!firebase.apps.length)firebase.initializeApp(cfg);let a=firebase.auth();if(!a.currentUser)await a.signInAnonymously();return firebase.firestore()}
function label(c){return c==='PERLU_EVALUASI'?'Perlu evaluasi':c==='DATA_TIDAK_MEMADAI'?'Data tidak memadai':'Pemantauan'}
function badge(c){return c==='PERLU_EVALUASI'?'warn':c==='DATA_TIDAK_MEMADAI'?'bad':'good'}
async function render(){let sessions=await all();$('sync').textContent=`${sessions.length} sesi tersimpan di laptop`;let box=$('list');box.innerHTML='';if(!sessions.length){box.innerHTML='<div class="panel empty">Belum ada sesi pengukuran. Hubungkan ESP32 dan lakukan pengukuran hingga STOP.</div>';return}
for(let s of sessions){let el=document.createElement('section');el.className='session';let d=new Date(s.startedAt);let left=document.createElement('div');let ev=s.evaluation||{};left.innerHTML=`<h3>${s.id}</h3><div class="muted">Mulai: ${s.startedAtLocal||d.toLocaleString('id-ID')} · Selesai: ${s.endedAtLocal|| (s.endedAt?new Date(s.endedAt).toLocaleString('id-ID'):'—')}<br>${s.sampleCount||0} sampel · interval ${s.sampleIntervalMs||1000} ms · durasi ${Math.round((s.durationMs||0)/1000)} detik</div><p><span class="badge ${badge(ev.category)}">${label(ev.category)}</span> <span class="badge">${s.synced?'Firebase tersinkron':'Tersimpan lokal'}</span></p>`;let actions=document.createElement('div');actions.className='actions';let qrBtn=document.createElement('button');qrBtn.className='secondary';qrBtn.textContent='Tampilkan QR';let reportBtn=document.createElement('button');reportBtn.textContent='Laporan';reportBtn.onclick=()=>location.href='Laporan_FSR4.html?id='+encodeURIComponent(s.id);actions.append(qrBtn,reportBtn);el.append(left,actions);let qr=document.createElement('div');qr.className='qrwrap';qr.id='qr-'+s.id;el.append(qr);qrBtn.onclick=()=>{qr.style.display=qr.style.display==='block'?'none':'block';if(qr.childElementCount===0){if(!s.synced){qr.innerHTML='<b>Belum tersinkron.</b><p>Sinkronkan sesi agar QR dapat dibuka dari perangkat lain.</p>';return}let url=new URL('Laporan_FSR4.html?id='+encodeURIComponent(s.id),location.href).href;new QRCode(qr,{text:url,width:180,height:180});let p=document.createElement('p');p.textContent='Pindai untuk membuka laporan sesi';qr.append(p)}};box.append(el)}
}
async function sync(){const btn=$('syncBtn');btn.disabled=true;btn.textContent='Menyinkronkan…';try{let db=await firebaseDB();let sessions=await all();let n=0;for(let s of sessions){if(s.synced)continue;let copy={...s};delete copy.synced;await db.collection('fsr4_sessions').doc(s.id).set(copy);s.synced=true;let idb=await openDB();await new Promise((r,j)=>{let tx=idb.transaction(STORE,'readwrite');tx.objectStore(STORE).put(s);tx.oncomplete=r;tx.onerror=()=>j(tx.error)});n++}$('sync').textContent=`Firebase aktif · ${n} sesi baru disinkronkan`;alert(`${n} sesi berhasil disinkronkan.`);await render()}catch(e){$('sync').textContent='Firebase gagal: '+e.message;alert('Sinkronisasi gagal: '+e.message+'\n\nPeriksa: internet, Anonymous Authentication, Authorized domain alfarabiroissulfata.github.io, dan Firestore Rules.')}finally{btn.disabled=false;btn.textContent='Sinkronkan Firebase'}}
$('refresh').onclick=render;$('syncBtn').onclick=sync;render();
</script></body></html>
